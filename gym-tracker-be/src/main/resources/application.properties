spring.application.name=gym-tracker

# Database Configuration
spring.datasource.url=jdbc:postgresql://db:5432/gym_tracker
spring.datasource.username=klaus
spring.datasource.password=P@ssw0rd!
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

server.address=0.0.0.0
server.port=8080

# Okta OAuth2 Configuration
# You need to replace these values with your actual Okta domain and credentials
okta.oauth2.issuer=https://{yourOktaDomain}/oauth2/default
okta.oauth2.client-id={yourClientId}
okta.oauth2.client-secret={yourClientSecret}

# Alternative Spring Security OAuth2 Client Configuration (if not using Okta Spring Boot Starter)
spring.security.oauth2.client.registration.okta.client-id=${okta.oauth2.client-id}
spring.security.oauth2.client.registration.okta.client-secret=${okta.oauth2.client-secret}
spring.security.oauth2.client.registration.okta.scope=openid,profile,email
spring.security.oauth2.client.registration.okta.redirect-uri=http://localhost:8080/login/oauth2/code/okta

spring.security.oauth2.client.provider.okta.issuer-uri=${okta.oauth2.issuer}
spring.security.oauth2.client.provider.okta.authorization-uri=${okta.oauth2.issuer}/v1/authorize
spring.security.oauth2.client.provider.okta.token-uri=${okta.oauth2.issuer}/v1/token
spring.security.oauth2.client.provider.okta.user-info-uri=${okta.oauth2.issuer}/v1/userinfo
spring.security.oauth2.client.provider.okta.jwk-set-uri=${okta.oauth2.issuer}/v1/keys
spring.security.oauth2.client.provider.okta.userNameAttribute=sub

# Logging
logging.level.org.springframework.security=DEBUG
logging.level.com.okta=DEBUG